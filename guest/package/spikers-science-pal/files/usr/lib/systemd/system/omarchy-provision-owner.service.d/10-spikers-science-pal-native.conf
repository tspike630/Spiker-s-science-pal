[Service]
# The setup form preselects `tzupdate -p`; Spiker's Science Pal's shim answers with the
# Mac's time zone, so keeping the default follows the Mac.
Environment=PATH=/usr/lib/spikers-science-pal/shims:/usr/bin
# The native VM disk is protected by the macOS account, and SDDM's X11 greeter
# does not render through this VirGL path. Keep the direct Spiker's Science Pal login that
# provisioning created instead of arming the unencrypted-install cleanup.
ExecStartPost=/usr/bin/rm -f /etc/systemd/system/graphical.target.wants/omarchy-provision-autologin-once.service /etc/systemd/system/omarchy-provision-autologin-once.service
# Give the new owner Spiker's Science Pal's per-user setup before the first session
# starts, so the VM display profile is active from the first frame.
ExecStartPost=-/usr/lib/spikers-science-pal/owner-setup
