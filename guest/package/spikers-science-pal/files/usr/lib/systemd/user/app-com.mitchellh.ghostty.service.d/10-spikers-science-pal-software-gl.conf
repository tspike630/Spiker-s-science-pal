# D-Bus activation starts Ghostty through this unit; run it through Try
# Spiker's Science Pal's software-renderer wrapper like every other launch.
[Service]
ExecStart=
ExecStart=/usr/lib/spikers-science-pal/bin/ghostty --gtk-single-instance=true --initial-window=false
# Ghostty 1.3.1's notify-reload unit fails under systemd 262: Ghostty reports
# ready before it handles SIGUSR2, so systemd refuses to start it. Readiness
# by bus name avoids that; Spiker's Science Pal reloads Ghostty with SIGUSR2 directly.
Type=dbus
